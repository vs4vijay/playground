# mkdir -p ~/my_data/hermes
# Setup: docker run -it --rm -v ~/my_data/hermes:/opt/data nousresearch/hermes-agent setup

name: hermes

services:
  hermes:
    image: nousresearch/hermes-agent:v2026.7.7.2
    container_name: hermes
    command: gateway run
    environment:
      HERMES_DASHBOARD: "1"
      # HERMES_DASHBOARD_OIDC_ISSUER: "http://localhost:8080/realms/master"
      # HERMES_DASHBOARD_OIDC_ISSUER: "http://localhost:8080/realms/hermes"
      # HERMES_DASHBOARD_OIDC_CLIENT_ID: "hermes-dashboard"
      HERMES_DASHBOARD_BASIC_AUTH_USERNAME: "viz"
      HERMES_DASHBOARD_BASIC_AUTH_PASSWORD: "hermes012agent"
      HERMES_DASHBOARD_BASIC_AUTH_SECRET: "someRandomSecret123"
      HERMES_DASHBOARD_PUBLIC_URL: "http://localhost:9119"
    ports:
      - "8642:8642"
      - "9119:9119"
    volumes:
      - ${HOME}/my_data/hermes:/opt/data
    restart: unless-stopped
    networks:
      - web

networks:
  web:
    name: web
