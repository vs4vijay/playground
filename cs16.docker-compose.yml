  #     - /home/ubuntu/my_data/cs16/bordeux:/data

  # MARCEL fun server ReGameDLL + AMX + 42 maps + RTV + admin menu (COMMENTED)
  # NOTE: upstream builds from git, same port 55555, run only one at a time:
  #   docker compose -f ~/cs16.docker-compose.yml up -d cs16-marcel
  # ARM STATUS 2026-09-13: also x86-only, same wall as vanilla/bordeux.
  #   Base FROM steamcmd/steamcmd:latest = linux/amd64 only (pull warns platform mismatch).
  #   Installs HLDS app 90 + i386 .so (cs.so, metamod.so, amxmodx_mm_i386.so,
  #   reunion_mm_i386.so, rechecker_mm_i386.so) + amxxpc compile. Build under
  #   qemu on ARM would be very slow/likely fail. Use x86_64 host. Default UDP 27015
  #   remapped here to 55555. Passwords via ./cs16.env (czero#123).
