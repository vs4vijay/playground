# NOTE 2026-09-13: host is aarch64 (ARM, Oracle A1).
# jives/hlds:cstrike, bordeux, marcel are x86-only (HLDS 32-bit).
# Native `docker compose pull/up` fails with: no matching manifest for linux/arm64/v8.
# Workaround tried: `docker pull --platform linux/amd64 <image>` downloads OK,
# but running under qemu-i386 hangs (uname test timed out) - too slow/unstable for FPS.
# RECOMMENDATION: run this file on x86_64 Oracle shape (E2/E3/E4), then it works as-is on port 55555.
# All passwords via ./cs16.env, defaults czero#123. Run only ONE service at a time (same port 55555).
services:
  # VANILLA CLASSIC - private 6-12 players (ACTIVE)
  cs16-vanilla:
    image: jives/hlds:cstrike
    platform: linux/amd64 # required on ARM hosts, native on x86_64
    container_name: cs16-vanilla
    restart: unless-stopped
    env_file:
      - ./cs16.env
    ports:
      - "55555:55555/udp"
      - "55555:55555/tcp"
      - "26900:26900/udp"
    volumes:
      - /home/ubuntu/my_data/cs16/vanilla/config:/temp/config
      - /home/ubuntu/my_data/cs16/vanilla/mods:/temp/mods
    command: >-
      +ip 0.0.0.0 +port 55555
      +maxplayers 12 +map de_dust2
      +hostname "Friends CS1.6 Vanilla"
      +sv_password "${SV_PASSWORD:-czero#123}"
      +rcon_password "${RCON_PASSWORD:-czero#123}"
      +log on

  # BORDEUX ReHLDS + AMXModX + Metamod-R (COMMENTED - uncomment to use instead of vanilla)
  # NOTE: uses same port 55555, run only one server at a time:
  #   docker compose -f ~/cs16.docker-compose.yml up -d cs16-bordeux
  # cs16-bordeux:
  #   image: ghcr.io/bordeux/cstrike-server:latest
  #   platform: linux/amd64 # x86-only, same ARM note as above
